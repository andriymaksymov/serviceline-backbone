services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"

  webhook:
    build: .
    command: uvicorn serviceline_backbone.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - rabbitmq

  wa-inbound-subscriber:
    build: .
    command: python -c "from serviceline_backbone.main import run_worker; run_worker()"
    environment:
      WORKER_ROLE: wa_inbound_subscriber
    env_file:
      - .env
    depends_on:
      - rabbitmq

  redis-aggregator:
    build: .
    command: python -c "from serviceline_backbone.main import run_worker; run_worker()"
    environment:
      WORKER_ROLE: redis_aggregator
    env_file:
      - .env
    depends_on:
      - redis
      - rabbitmq

  wa-aggregated-subscriber:
    build: .
    command: python -c "from serviceline_backbone.main import run_worker; run_worker()"
    environment:
      WORKER_ROLE: wa_aggregated_subscriber
    env_file:
      - .env
    depends_on:
      - qdrant
      - rabbitmq

  ai-inbound-subscriber:
    build: .
    command: python -c "from serviceline_backbone.main import run_worker; run_worker()"
    environment:
      WORKER_ROLE: ai_inbound_subscriber
    env_file:
      - .env
    depends_on:
      - rabbitmq

  ai-result-subscriber:
    build: .
    command: python -c "from serviceline_backbone.main import run_worker; run_worker()"
    environment:
      WORKER_ROLE: ai_result_subscriber
    env_file:
      - .env
    depends_on:
      - rabbitmq
