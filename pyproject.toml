[project]
name = "serviceline-backbone"
version = "0.1.0"
description = "Minimal serviceline backbone for WhatsApp support routing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.8.0",
  "redis>=5.0.0",
  "pika>=1.3.2",
  "qdrant-client>=1.10.0",
  "openai>=1.50.0"
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["serviceline_backbone*"]
